<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StarSelect</title>
<meta name="description" content="Turn any CV and role description into structured, evidence-based STAR interview questions — choose or tailor, interview, score and print. By ConstructEng Australia.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1E3461">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StarSelect">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F9;--surface:#FFFFFF;--soft:#EBEFF5;--line:#D9DFE8;--text:#172033;--muted:#5A6477;
  --nav:#1E3461;--nav-text:#E6EBF5;--nav-muted:#9FB0CF;--gold:#B8913B;--gold-soft:#F3EAD6;
  --primary:#1E3461;--on-primary:#FFFFFF;--good:#2E7A56;--warn:#9A6410;--bad:#AA3E2B;--shadow:0 10px 30px rgba(20,32,60,.18);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1626;--surface:#172136;--soft:#1D2940;--line:#2B3953;--text:#E5EAF3;--muted:#9AA6BC;
    --nav:#0B1220;--nav-text:#E5EAF3;--nav-muted:#8393AE;--gold:#D2B062;--gold-soft:#33301F;
    --primary:#D2B062;--on-primary:#161308;--good:#5DBB8C;--warn:#E0A94A;--bad:#E5806C;--shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#0F1626;--surface:#172136;--soft:#1D2940;--line:#2B3953;--text:#E5EAF3;--muted:#9AA6BC;
  --nav:#0B1220;--nav-text:#E5EAF3;--nav-muted:#8393AE;--gold:#D2B062;--gold-soft:#33301F;
  --primary:#D2B062;--on-primary:#161308;--good:#5DBB8C;--warn:#E0A94A;--bad:#E5806C;--shadow:0 10px 30px rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Newsreader,Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(28px,4vw,38px);line-height:1.1}
h2{font-size:24px;line-height:1.2}
h3{font-size:19px;line-height:1.25;margin-bottom:10px}
p{margin:0 0 10px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--nav);color:var(--nav-text);display:flex;flex-direction:column;padding:22px 14px 16px}
.brand{padding:0 10px 22px}
.brand strong{display:block;font-family:Newsreader,Georgia,serif;font-size:22px;font-weight:500;line-height:1.15}
.brand span{color:var(--nav-muted);font-size:13px}
.modesw{display:flex;width:100%;background:rgba(255,255,255,.12);border:0;border-radius:99px;padding:3px;cursor:pointer;margin:0 0 18px}
.modesw span{flex:1;text-align:center;padding:7px 12px;border-radius:99px;font-size:13px;font-weight:700;color:var(--nav-muted);white-space:nowrap}
.modesw span.on{background:var(--gold);color:#1B1507}
.mhead .modesw{width:auto;margin:0;flex:none}
.mhead .modesw span{padding:6px 11px}
.navl{display:flex;flex-direction:column;gap:2px}
.navl button{display:flex;align-items:center;gap:11px;background:none;border:0;border-radius:8px;padding:9px 10px;color:var(--nav-muted);font-weight:500;text-align:left;cursor:pointer}
.navl button:hover{color:var(--nav-text);background:rgba(255,255,255,.06)}
.navl button.on{color:var(--nav-text);background:rgba(255,255,255,.1)}
.navl button.on svg{color:var(--gold)}
.navl svg,.bnav svg{width:18px;height:18px;flex:none}
.sidefoot{margin-top:auto;padding:10px;font-size:12px;color:var(--nav-muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.dot.busy{background:var(--gold)}
.dot.off{background:var(--nav-muted)}
main{padding:30px clamp(16px,4vw,44px) 60px;min-width:0;max-width:1240px;width:100%}
.mhead{display:none}
.bnav{display:none}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top .sub{color:var(--muted);margin-top:6px}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;margin-bottom:10px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer;color:var(--text);white-space:nowrap;text-decoration:none;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.panel.flat{background:none;border:0;padding:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 18px}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-weight:600;font-size:13px}
.f small{color:var(--muted);font-size:12px;margin-top:-2px}
.f.wide{grid-column:1/-1}
input,textarea,select{font:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--text);width:100%}
textarea{resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:7px 0;cursor:pointer}
.chk input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:var(--gold)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:20px;scrollbar-width:none}
.tab{padding:10px 14px;border:0;background:none;border-bottom:2px solid transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--text);border-bottom-color:var(--gold)}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--muted);font-weight:600;white-space:nowrap}
.tag.gold{background:var(--gold-soft);color:var(--warn)}
.tag.good{color:var(--good)}
.tag.bad{color:var(--bad)}
.pips{display:inline-flex;gap:4px;flex:none}
.pip{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:7px;font-weight:600;color:var(--muted);cursor:pointer;font-size:14px}
.pip.on{background:var(--gold);border-color:var(--gold);color:#1B1507}
.rate{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.rate:last-child{border-bottom:0}
.ev{display:inline-flex;gap:10px;align-items:center;font-size:11px;color:var(--muted);font-weight:600}
.ev span{display:inline-flex;align-items:center;gap:4px}
.ev b{display:inline-flex;gap:2px}
.ev b i{width:5px;height:12px;border-radius:1px;background:var(--line)}
.ev b i.on{background:var(--gold)}
.ev.lg{font-size:12px;gap:16px}
.ev.lg b i{width:8px;height:18px}
.list .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.row.click{cursor:pointer}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:13px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-family:Newsreader,Georgia,serif;font-size:30px;font-weight:500;line-height:1.1}
.stat span{color:var(--muted);font-size:13px}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--nav);border-radius:10px;padding:16px;cursor:pointer;text-align:left;width:100%}
.rcard:hover{border-color:var(--muted);border-left-color:var(--gold)}
.rcard h3{margin:0 0 2px;font-size:20px}
.funnel{display:flex;gap:3px;margin-top:14px}
.funnel div{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.funnel div b{display:block;font-size:15px;color:var(--text);background:var(--soft);border-radius:5px;padding:3px 0;margin-bottom:3px}
.funnel div b.z{color:var(--muted);font-weight:400}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:14px;align-items:flex-start}
.col{flex:0 0 238px;background:var(--soft);border-radius:10px;padding:10px;min-height:140px}
.col.over{outline:2px dashed var(--gold)}
.col h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;color:var(--muted);font-weight:600}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--muted)}
.card .n{font-weight:600;margin-bottom:2px}
.card .s{font-size:12px;color:var(--muted);margin-bottom:8px}
.card .due{font-size:12px;margin-top:8px;color:var(--warn);font-weight:600}
.card .due.late{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.chip.on{background:var(--nav);color:#fff;border-color:var(--nav)}
.q{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;justify-content:space-between;align-items:flex-start}
.q:last-child{border-bottom:0}
.q .meta{font-size:12px;color:var(--muted);margin-bottom:3px}
.q .acts{display:flex;gap:6px;flex:none}
.sel{background:var(--gold-soft)!important;border-color:var(--gold)!important;color:var(--text)!important}
.msg{white-space:pre-wrap;background:var(--soft);border-radius:10px;padding:16px;font-size:14px;line-height:1.55}
.bar{height:10px;border-radius:3px;background:var(--gold);min-width:2px}
.barrow{display:grid;grid-template-columns:130px 1fr 44px;gap:10px;align-items:center;padding:5px 0;font-size:13px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text)}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:var(--gold-soft);border-radius:0 8px 8px 0;font-size:14px;margin-bottom:14px}
.script{font-style:italic;color:var(--muted);margin:4px 0 12px}
.log{font-size:13px}
.log div{padding:6px 0;border-bottom:1px solid var(--line)}
.log time{color:var(--muted);margin-right:8px}
.onb{max-width:760px}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0 20px}
.choice button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;cursor:pointer}
.choice button.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.choice b{display:block;font-family:Newsreader,Georgia,serif;font-size:20px;font-weight:500}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:12px 0 12px 44px;position:relative;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:30px;height:30px;border-radius:50%;background:var(--nav);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
.steps li b{display:block}
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.45);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:51;overflow-y:auto;box-shadow:var(--shadow);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:16px 22px 0;z-index:2}
.dhead .tabs{margin:12px -4px 0;border-bottom:0}
.dbody{padding:20px 22px 60px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;background:var(--surface);border-radius:14px;z-index:61;padding:22px;box-shadow:var(--shadow)}
.modal-scrim{z-index:60}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:14px;z-index:90;max-width:calc(100% - 32px)}
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
.xclose{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.drop{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1.5px dashed var(--line);border-radius:10px;padding:14px}
.upl{position:relative;overflow:hidden;cursor:pointer}
.upl input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;z-index:2}
.scans{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:14px}
.scans figure{margin:0}
.scans figcaption{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-top:4px}
.scanthumb{display:grid;place-items:center;width:100%;aspect-ratio:3/4;border:1px solid var(--line);border-radius:8px;background:var(--soft);overflow:hidden;padding:0;cursor:pointer}
.scanthumb img{width:100%;height:100%;object-fit:cover}
.scanfull{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line)}
.authwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;gap:14px}
.authcard{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.authcard h1{margin:6px 0 6px;font-size:30px}
.authbrand{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.authform{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.authform .btn{justify-content:center;padding:11px}
.capg{background:var(--nav);color:#fff;margin-right:4px}
.caps{background:var(--gold-soft);color:var(--text)}
.lvl{font-size:12px;color:var(--muted);margin-left:6px}
.grph{background:var(--nav);color:#fff;font-family:Newsreader,Georgia,serif;font-size:19px;padding:10px 14px;border-radius:8px;margin:18px 0 8px}
.grph:first-child{margin-top:4px}
.grph span,.subh span,.fwg span{display:block;font-family:"Instrument Sans",system-ui,sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:700}
.subh{background:var(--soft);border-left:4px solid var(--gold);padding:8px 12px;border-radius:0 8px 8px 0;margin:12px 0 2px}
.subh b{display:block;font-size:15px}.subh em{display:block;font-size:13px;color:var(--muted)}
.subh span{color:var(--muted)}
.fw{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.fwrow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px}
.fwg{background:var(--nav);color:#fff;border:2px solid transparent;border-radius:8px;font-weight:700;padding:10px 12px;text-align:left;cursor:pointer;font-size:14px}
.fwsubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.fws{background:var(--soft);border:2px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font-size:12px;color:var(--muted)}
.fws b{display:block;font-size:13px;color:var(--text);margin-bottom:2px}
.fwg.on,.fws.on{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.startpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:18px}
.sp{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:18px;cursor:pointer;color:var(--text);display:flex;flex-direction:column;gap:6px}
.sp:hover{border-color:var(--gold)}.sp b{font-family:Newsreader,Georgia,serif;font-size:21px;font-weight:500}.sp span{color:var(--muted);font-size:14px}.sp em{font-style:normal;font-weight:700;color:var(--text);margin-top:4px}
.chsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.chstep{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--muted)}
.chstep b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase}.chstep span{font-size:13px}
.chstep.on{background:var(--nav);color:#fff;border-color:var(--nav)}.chstep.done{border-color:var(--gold);color:var(--text)}.chstep[disabled]{opacity:.45;cursor:default}
.chlv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:10px}
.chlvb{border:2px solid var(--line);background:var(--soft);border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;color:var(--text)}
.chlvb b{display:block;font-family:Newsreader,Georgia,serif;font-size:24px;font-weight:500}.chlvb span{color:var(--muted);font-size:13px}
.chlvb.on,.chlvb:hover{border-color:var(--gold)}
.fws{position:relative}.fws em{display:block;font-style:normal;font-weight:700;color:var(--text);margin-top:4px;font-size:11px}
.fws.picked{background:var(--gold-soft);border-color:var(--gold)}
.tick{position:absolute;top:6px;right:8px;font-style:normal;background:var(--gold);color:#1B1507;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:12px;font-weight:700}
.chqs{display:flex;flex-direction:column;gap:6px;margin:8px 0 6px}
.chq{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;cursor:pointer;color:var(--text);font-size:15px}
.chq .n{color:var(--muted);font-weight:700}.chq .l{font-size:12px;color:var(--muted);white-space:nowrap}
.chq.on{background:var(--nav);border-color:var(--nav);color:#fff}.chq.on .n,.chq.on .l{color:#DCE3EF}
.chown{display:flex;gap:8px;margin:4px 0 10px}
.chnav{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);margin-bottom:10px}
.drop.over{border-color:var(--gold);background:var(--gold-soft)}
.qcols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px;align-items:start}
.gside{position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.tplgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:18px}
.tplgrid .panel{margin:0;display:flex;flex-direction:column}
.tpl .btns{margin-top:auto;padding-top:8px}
.hr{height:1px;background:var(--line);margin:18px 0}
h1,h2,h3,h4,.tab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pressing{opacity:.55;transition:opacity .45s}
.helpbox p{font-size:15px;line-height:1.6}
.tipbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
@media (max-width:980px){.cols{grid-template-columns:1fr}}
@media (max-width:820px){
  .helpbox{top:auto;bottom:0;left:0;right:0;transform:none;width:100%;border-radius:16px 16px 0 0;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .mhead{display:flex;position:sticky;top:0;z-index:30;background:var(--nav);color:var(--nav-text);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top,0px));margin-top:calc(-1 * env(safe-area-inset-top,0px));justify-content:space-between;align-items:center}
  .mhead strong{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:19px}
  .mhead span{font-size:12px;color:var(--nav-muted)}
  main{padding:20px 16px 110px}
  .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:40}
  .bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;border:0;background:none;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
  .bnav button.on{color:var(--text)}
  .bnav button.on svg{color:var(--gold)}
  .choice{grid-template-columns:1fr}
  .rate{flex-direction:column;align-items:flex-start}
  .dhead{padding:14px 16px 0}
  .dbody{padding:16px 16px 60px}
  .q{flex-direction:column}
  .chsteps{grid-template-columns:repeat(4,1fr);gap:4px}.chstep{padding:6px}.chstep span{font-size:11px}.chstep b{font-size:10px}
  .chq .l{display:none}
  .chnav{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
  .tab{padding:10px 10px;font-size:14px}
  .qcols{grid-template-columns:1fr}
  .fwrow{grid-template-columns:1fr}
  .gside{position:static;order:-1}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .barrow{grid-template-columns:100px 1fr 36px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

function recommend(r){let p=0;const why=[];
  if(r.seniority==="Senior Service"){p++;why.push("senior or leadership hire");}
  if(r.scarcity==="High"){p+=2;why.push("high market scarcity");}else if(r.scarcity==="Medium"){p++;why.push("moderate market scarcity");}
  const urgent=r.urgency==="High";if(urgent)why.push("high urgency");
  let k="passive";if(p>=2)k=urgent?"both":"proactive";else if(p===1&&urgent)k="both";
  if(!why.length)why.push("well defined role with a likely applicant pool");
  return{k,why};}
const STRAT={passive:"Passive: advertise and attract",proactive:"Proactive: search and headhunt",both:"Passive and proactive together"};
const stratOf=r=>(r.strategy&&r.strategy!=="auto")?r.strategy:recommend(r).k;
function briefFields(r){let f=[];BRIEF_A.forEach(s=>s[1].forEach(x=>f.push(x[0])));if(r.briefMode==="full")BRIEF_B.forEach(s=>s[1].forEach(x=>f.push(x[0])));return f;}
function completeness(r){const f=briefFields(r);const done=f.filter(k=>String((r.brief||{})[k]||"").trim()).length;return Math.round(done/f.length*100);}

 },

 ref(c,id){if(c==="bank")return this.db.doc(this.root+"/bank");return c==="settings"?this.db.doc(this.root+"/settings"):this.db.doc(this.root+"/ws").collection(c).doc(id);},
 save(c,id){

 },
 async flush(c,id){
  const k=c+"/"+id;if(this.busy[k]){this.again[k]=true;return;}
  this.busy[k]=true;setDot();
  try{const o=obj(c,id);if(this.kind==="server"){if(o)await api(`/api/doc/${c}/${id}`,{data:clone(o)},"PUT");else await api(`/api/doc/${c}/${id}`,undefined,"DELETE");this.offline=false;}

    else toast("Could not save a change ("+((e&&e.code)||"error")+").");}
  finally{this.busy[k]=false;if(this.again[k]){this.again[k]=false;this.flush(c,id);}setDot();}
 },

function fld(c,id,p,label,o={}){

  else if(o.type==="select")inp=`<select data-b="${b}"${o.rr?" data-rr":""}>${o.opts.map(x=>{const[v2,l]=Array.isArray(x)?x:[x,x];return`<option value="${esc(v2)}"${String(val)===String(v2)?" selected":""}>${esc(l||"Select")}</option>`;}).join("")}</select>`;

function roleBrief(r){

  return`<div class="panel"><div class="top" style="margin-bottom:12px"><div><h3 style="margin:0">Brief depth</h3><div class="muted small">${pct}% complete</div></div>${chips([["concise","Concise"],["full","Full"]],r.briefMode,"briefMode")}</div>
  <p class="muted small">Concise suits a like for like backfill with an established team and unchanged scope. Full suits new or restructured roles, senior hires and proactive or headhunt searches.${!full&&sugFull?" This role looks like it needs the full brief.":""}</p>
  <div class="grid2" style="margin-top:12px">
   ${isAg()?fld(c,id,"clientId","Client",{type:"select",rr:1,opts:[["","Select a client"],...Object.values(S.clients).map(x=>[x.id,x.name||"Unnamed client"])]}):""}
   ${fld(c,id,"seniority","Seniority",{type:"select",rr:1,opts:[["Award Staff","Mid level"],["Senior Service","Senior / management"]]})}
   ${fld(c,id,"roleType","Role family",{type:"select",rr:1,opts:[["General","General"],["Underwriting","Underwriting, risk or broker facing"]]})}
   ${fld(c,id,"scarcity","Market scarcity",{type:"select",rr:1,opts:["Low","Medium","High"]})}
   ${fld(c,id,"urgency","Urgency",{type:"select",rr:1,opts:["Low","Medium","High"]})}
   ${fld(c,id,"opened","Date opened",{type:"date"})}
   ${isAg()?fld(c,id,"feePct","Fee (% of first year salary)",{type:"number",hint:"Leave blank to use the client's standard terms"}):""}
  </div>
  <div class="note" style="margin-top:16px"><b>Recommended sourcing: ${esc(STRAT[rec.k])}.</b> Based on ${esc(rec.why.join(", "))}.</div>

/* Sourcing */
function roleSourcing(r){
  const st=stratOf(r);const c="roles",id=r.id;const rec=recommend(r);
  const sourced=appsFor(r.id).filter(a=>a.stage==="sourced");
  const out=`<div class="panel"><h3>Outreach message</h3><p class="muted small">Built from the brief using the outreach framework: a specific hook, the organisation's momentum, a concrete role description, a genuine offer and a low pressure close.${r.confidential?" Confidential search is on, so the employer is not named.":""}</p>
   <div class="grid2">${fld(c,id,"out.first","Candidate first name",{live:"out"})}${fld(c,id,"out.hook","Hook: why this candidate, why now",{type:"area",rows:2,live:"out",ph:"Your work leading the property portfolio at ... caught my attention"})}${fld(c,id,"out.momentum","Organisation momentum",{type:"area",rows:2,live:"out",ph:defMomentum(r)})}${fld(c,id,"out.desc","The role and how it connects to their expertise",{type:"area",rows:2,live:"out",ph:defDesc(r)})}${fld(c,id,"out.evp","What the organisation offers",{type:"area",rows:2,live:"out",ph:defEvp(r)})}${fld(c,id,"out.sign","Sign off",{type:"area",rows:2,live:"out",ph:S.settings.me||"Your name, title and a short positioning line"})}</div>

   <div class="btns" style="margin-top:12px"><button class="btn" data-act="copy" data-target="outPrev">Copy message</button>${CAP.sample?`<button class="btn" data-act="aiOut">Draft with Claude</button>`:""}</div>
   ${CAP.sample?`<div id="aiOutWrap" style="margin-top:12px${r.outDraft?"":";display:none"}">${fld(c,id,"outDraft","Claude's draft (edit freely)",{type:"area",rows:9})}<div class="btns" style="margin-top:8px"><button class="btn sm" data-act="copyField" data-b="roles|${id}|outDraft">Copy draft</button></div></div>`:""}</div>`;
  const ad=CAP.sample?`<div class="panel"><h3>Job advertisement</h3><p class="muted small">Drafted from the brief for job boards and the careers page.</p><button class="btn" data-act="aiAd">Draft advert with Claude</button><div id="aiAdWrap" style="margin-top:12px${r.adDraft?"":";display:none"}">${fld(c,id,"adDraft","Advert (edit freely)",{type:"area",rows:14})}<div class="btns" style="margin-top:8px"><button class="btn sm" data-act="copyField" data-b="roles|${id}|adDraft">Copy advert</button></div></div></div>`:"";
  return`<div class="panel"><h3>Strategy</h3>${fld(c,id,"strategy","Sourcing approach",{type:"select",rr:1,opts:[["auto","Recommended: "+STRAT[rec.k]],["passive",STRAT.passive],["proactive",STRAT.proactive],["both",STRAT.both]]})}
   <p class="muted small" style="margin-top:10px">Passive suits well defined roles with a strong likely applicant pool. Proactive suits senior, niche or historically hard to fill roles. Agree the approach and timeline with the hiring manager up front.</p></div>
  <div class="cols"><div>
   ${st!=="proactive"?`<div class="panel"><h3>Advertise and attract</h3>${PASSIVE_CK.map(([k,l])=>chk(c,id,"src."+k,esc(l))).join("")}</div>`:""}
   ${st!=="passive"?`<div class="panel"><h3>Search and headhunt</h3><p class="muted small">Start with what already exists before running a new search.</p>${PRO_CK.map(([k,l])=>chk(c,id,"src."+k,esc(l))).join("")}<div class="btns" style="margin-top:10px"><button class="btn sm" data-act="poolMatch">Find matches in the talent pool</button></div><div id="poolRes"></div></div>`:""}
   ${out}${ad}</div>
   <div><div class="panel"><h3>Hiring manager review</h3><p class="muted small">Each sourced profile gets a Good fit or Not a fit call before any outreach.</p>${sourced.length?`<div class="list">${sourced.map(a=>{const cd=S.candidates[a.candId];return`<div class="row"><div><div class="t">${esc(shownName(cd,a))}</div><div class="s">${esc([cd.currentTitle,cd.currentEmployer].filter(Boolean).join(", "))}</div></div><div class="btns"><button class="btn sm${a.hm==="Good fit"?" sel":""}" data-act="hm" data-id="${a.id}" data-v="Good fit">Good fit</button><button class="btn sm${a.hm==="Not a fit"?" sel":""}" data-act="hm" data-id="${a.id}" data-v="Not a fit">Not a fit</button></div></div>`;}).join("")}</div>`:`<p class="muted small">Candidates in the Sourced stage appear here.</p>`}</div>
   ${r.confidential?`<div class="panel"><h3>Confidential search</h3><p class="small">An independent contact approaches candidates without naming the employer. Once a candidate confirms genuine interest, they sign an NDA before any further detail is shared.</p>${chk(c,id,"src.nda","NDA template ready")}${chk(c,id,"src.indep","Independent contact briefed on the target profile")}</div>`:""}</div></div>`;
}
const firstLine=t=>String(t||"").split(/\n|;/).map(s=>s.replace(/^[\s\d.)•*-]+/,"").trim()).filter(Boolean)[0]||"";
function defMomentum(r){const org=r.confidential?"My client":(roleOrg(r)||"We");return`${org} ${org==="We"?"have":"has"} a new opportunity for a ${roleTitle(r)}${firstLine(r.brief&&r.brief.priorities)?", focused on "+firstLine(r.brief.priorities).replace(/\.$/,"").toLowerCase():""}.`;}
function defDesc(r){const s=firstLine(r.brief&&r.brief.structure);return`Working closely with ${s?s.replace(/\.$/,"").toLowerCase():"an established team"}, you would help shape ${firstLine(r.brief&&r.brief.why).replace(/\.$/,"").toLowerCase()||"the direction of the function"}.`;}
function defEvp(r){return firstLine(r.brief&&r.brief.diff)||"We offer flexible work arrangements, an inclusive team culture and a well located office.";}
function outreachText(r){const o=r.out||{};const nm=o.first||"[First name]";
  return[`Hi ${nm},`,o.hook||"[A specific, relevant reason you are contacting this person now]",o.momentum||defMomentum(r),o.desc||defDesc(r),o.evp||defEvp(r),"Are you open to a confidential chat to see if this could be a fit?",o.sign||S.settings.me||"[Your name and title]"].join("\n\n");}

/* Interview kit */

  const lvl=r.seniority==="Senior Service"?["Senior Service","Both"]:["Award Staff","Both"];

  <div class="panel"><h3>Capabilities to assess</h3><p class="muted small">Pick the 2 or 3 capability groups that matter most for this role. Questions are filtered to ${r.seniority==="Senior Service"?"senior / management":"mid level"} level.</p>${chips(GROUPS.map(g=>[g,g]),groups,"kitGroup",true)}</div>

  <div><div class="panel"><h3>Interview questions ${iq.length} of 5</h3>${iq.length<4?`<p class="small" style="color:var(--warn)">Select 4 to 5 questions for the panel interview.</p>`:""}<ol style="padding-left:20px;margin:0">${iq.map(id=>{const q=qById(id);return q?`<li style="margin-bottom:8px"><span class="muted small">${esc(q.s)}</span><br>${esc(q.t)}</li>`:"";}).join("")}</ol></div>

  <div class="btns" style="margin-top:14px"><button class="btn pri" data-act="roleGuide">Create interview guide</button><button class="btn" data-act="dlGuide">Print</button></div></div></div></div>`;

  const tabs=[["overview","Overview"],["cv","CV screen"],["screen","Phone screen"],["interview","Interview"],["refs","References"],["offer","Offer"]];
  const t=R.atab||"overview";
  let body={overview:dOverview,cv:dCV,screen:dScreen,interview:dInterview,refs:dRefs,offer:dOffer}[t](a,c,r);

/* ---------- Reports ---------- */
function repData(){
  const apps=Object.values(S.apps).filter(a=>S.roles[a.roleId]&&(!UI.repRole||a.roleId===UI.repRole));
  const reached=(a,k)=>Math.max(a.maxIdx==null?-1:a.maxIdx,stIdx(a.stage))>=stIdx(k);
  return{apps,reached};
}
function vReports(){
  const{apps,reached}=repData();const stg=STG();
  const fun=stg.map(([k,l])=>[l,apps.filter(a=>reached(a,k)).length]);const mx=Math.max(1,...fun.map(x=>x[1]));
  const bySrc={};apps.forEach(a=>{const s=a.source||(S.candidates[a.candId]&&S.candidates[a.candId].source)||"Not recorded";bySrc[s]=bySrc[s]||{n:0,i:0,h:0};bySrc[s].n++;if(reached(a,"interview"))bySrc[s].i++;if(a.stage==="hired")bySrc[s].h++;});
  const hires=apps.filter(a=>a.stage==="hired");
  const tth=avg(hires.map(a=>{const r=S.roles[a.roleId];return r.opened&&a.stageAt&&a.stageAt.hired?Math.max(1,daysBetween(r.opened,a.stageAt.hired)):null;}));
  const acc=apps.filter(a=>a.offer&&a.offer.status==="Accepted").length,dec=apps.filter(a=>a.offer&&a.offer.status==="Declined").length;
  const fees=hires.reduce((s,a)=>s+feeFor(a),0);
  const qual=avg(hires.map(intAvg));
  return`<div class="top"><div><h1>Reports</h1><div class="sub">Funnel, channel effectiveness and time to hire</div></div><select style="width:auto" id="repRole" aria-label="Role filter"><option value="">All roles</option>${Object.values(S.roles).map(r=>`<option value="${r.id}"${UI.repRole===r.id?" selected":""}>${esc(roleTitle(r))}</option>`).join("")}</select></div>
  <div class="stats"><div class="stat"><b>${hires.length}</b><span>${isAg()?"Placements":"Hires"}</span></div><div class="stat"><b>${tth?Math.round(tth):"n/a"}</b><span>Average days to ${isAg()?"place":"hire"}</span></div><div class="stat"><b>${acc+dec?Math.round(acc/(acc+dec)*100)+"%":"n/a"}</b><span>Offer acceptance</span></div>${isAg()?`<div class="stat"><b>${fees?money(fees):"n/a"}</b><span>Fees from placements</span></div>`:`<div class="stat"><b>${qual?qual.toFixed(1):"n/a"}</b><span>Average interview score of hires</span></div>`}</div>

 aiOut:el=>{const r=S.roles[R.id];const o=r.out||{};aiRun(`Write a LinkedIn InMail approaching a passive candidate about a role. ${S.settings.style||DEFAULT_STYLE}\nFollow this framework: open with a specific, relevant hook (why this candidate, why now), never a generic template feel; one or two lines on the organisation's momentum relevant to the role; a concrete description of the role and how it connects to their current expertise; a genuine, low pressure line on what the organisation offers; close with an easy, low commitment ask such as whether they are open to a confidential chat; sign with the sender's name and title. Keep it under 150 words.${r.confidential?" This is a confidential search: do not name the employer, describe it in general terms only.":""}\nSender: ${S.settings.me||"the recruiter"}\nCandidate first name: ${o.first||"[First name]"}\nWhy this candidate: ${o.hook||"not given, leave a clear placeholder"}\nRole brief:\n${briefSummary(r)}\nReply with only the message.`,"outDraft","aiOutWrap",el);},

 aiCV:async el=>{const txt=$("#cvText").value.trim();if(!txt){toast("Paste the CV text first.");return;}const c=S.candidates[R.id];el.disabled=true;el.textContent="Reading CV";
   try{const j=await CAP.sample.json(`Extract candidate details from this CV. Reply with only a JSON object with these string fields (empty string if not stated): name, email, phone, location, currentTitle, currentEmployer, empType (one of "Full-time","Contract","Part-time","Casual","Not currently employed", or ""), linkedin (a public linkedin.com/in/ URL only), tags (up to 6 comma separated skills or sectors), notes (2 to 3 sentence factual career summary in Australian English, no dashes as punctuation).\nCV:\n${txt.slice(0,40000)}`);
     let n=0;["name","email","phone","location","currentTitle","currentEmployer","empType","linkedin","tags","notes"].forEach(k=>{if(j&&j[k]&&!String(c[k]||"").trim()){c[k]=String(j[k]);n++;}});save("candidates",c.id);render();toast(n?"Filled "+plural(n,"field"):"No empty fields to fill.");}
   catch(e){toast(aiErr(e));el.disabled=false;el.textContent="Fill profile";}},

function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[data-src="${src}"]`)){res();return;}const s=document.createElement("script");s.src=src;s.dataset.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error("A file reader could not load. Check your internet connection, or paste the text instead."));document.head.appendChild(s);});}
async function imgLimits(){try{if(!CAP.sample||!CAP.sample.limits)return null;const l=await Promise.resolve(CAP.sample.limits());return l&&l.images?l.images:null;}catch(e){return null;}}
async function pdfDoc(file){await loadScript(LIBS.pdf);try{await loadScript(LIBS.pdfw);}catch(e){}const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=LIBS.pdfw;return lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;}
async function readFileText(file){
  const n=(file.name||"").toLowerCase();
  if(/\.(txt|md|csv|rtf|text)$/.test(n)||(file.type||"").startsWith("text/")){let t=await file.text();if(n.endsWith(".rtf"))t=t.replace(/\\par[d]?/g,"\n").replace(/\{\\[^}]*\}|\\[a-z]+-?\d* ?|[{}]/g,"");return t;}
  if(n.endsWith(".pdf")||file.type==="application/pdf"){const doc=await pdfDoc(file);const out=[];for(let i=1;i<=Math.min(doc.numPages,30);i++){const p=await doc.getPage(i);const c=await p.getTextContent();out.push(c.items.map(it=>(it.str||"")+(it.hasEOL?"\n":" ")).join(""));}return out.join("\n\n");}
  if(n.endsWith(".docx")){await loadScript(LIBS.zip);const z=await window.JSZip.loadAsync(await file.arrayBuffer());const f=z.file("word/document.xml");if(!f)throw new Error("That Word file could not be read.");const xml=await f.async("string");const d=new DOMParser().parseFromString(xml,"application/xml");const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
    return[...d.getElementsByTagNameNS(W,"p")].map(p=>{let t="";for(const el of p.getElementsByTagNameNS(W,"*")){if(el.localName==="t")t+=el.textContent;else if(el.localName==="tab")t+=" ";else if(el.localName==="br")t+="\n";}return t;}).join("\n");}
  if(n.endsWith(".doc"))throw new Error("Older .doc files can't be read. Save it as .docx or PDF, or paste the text.");
  throw new Error("That file type isn't supported. Use PDF, Word (.docx), text, or a photo.");
}
async function pdfToImages(file,max){const doc=await pdfDoc(file);const out=[];for(let i=1;i<=Math.min(doc.numPages,max);i++){const p=await doc.getPage(i);const vp=p.getViewport({scale:1.6});const c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;out.push(await new Promise(r=>c.toBlob(r,"image/jpeg",.85)));}return out;}
async function handleFile(kind,file){
  const g=S.guides[R.id];if(!g||!file)return;const st=$("#st_"+kind);const setSt=t=>{const x=$("#st_"+kind);if(x)x.textContent=t;};
  const bag=()=>(IMG[g.id]=IMG[g.id]||{jd:[],cv:[]});
  if((file.type||"").startsWith("image/")){const lim=await imgLimits();if(!lim){toast("Photos can only be read inside Claude. Upload a PDF or Word file, or paste the text.");return;}bag()[kind].push(file);g[kind+"Name"]=plural(bag()[kind].length,"photo")+" attached";save("guides",g.id);render();toast("Photo attached. It is read when you generate questions.");return;}
  setSt("Reading "+file.name+"...");
  try{let t=(await readFileText(file)).replace(/\u0000/g,"").replace(/[ \t]+\n/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
    if(t.length<80&&/\.pdf$/i.test(file.name)){const lim=await imgLimits();if(lim){setSt("Scanned document, preparing page images...");const ims=await pdfToImages(file,Math.min(4,lim.maxCount||4));bag()[kind]=ims;g[kind+"Name"]=file.name+" (scanned, "+plural(ims.length,"page")+" attached)";save("guides",g.id);render();toast("Scanned PDF attached as images.");return;}
      throw new Error("No text found in that PDF. It may be scanned: paste the text instead.");}
    g[kind]=t.slice(0,60000);g[kind+"Name"]=file.name;save("guides",g.id);render();toast("Loaded "+file.name);}
  catch(e){setSt("");toast(e.message||"Could not read that file.");}
}

function bankMatch(g){const jd=(g.jd||"").toLowerCase(),cv=(g.cv||"").toLowerCase();const senior=/\b(head of|manager|director|lead|leader|senior|principal|chief|executive)\b/.test(jd+" "+(g.role||"").toLowerCase());
  const sc=Object.entries(KW).map(([s,re])=>{const a=(jd.match(re)||[]).length,b=(cv.match(re)||[]).length;return[s,Math.min(a,6)*2+Math.min(b,6),(jd.match(re)||[])[0]];}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8);

  if(!g.cand){const l=(g.cv||"").split("\n").map(x=>x.trim()).find(Boolean)||"";if(l.length<40&&/^[A-Z][a-zA-Z'-]+( [A-Z][a-zA-Z'-]+){1,3}$/.test(l))g.cand=l;}
  g.pool=pool;g.analysis={matched:true,requirements:[],strengths:[],gaps:[],seniority:senior?"Senior Service":"Award Staff"};}

const PCSS=`@page{size:A4;margin:14mm}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}.pb{break-before:page;page-break-before:always}body{font:10.5pt/1.45 Arial,Helvetica,sans-serif;color:#172033;margin:0 auto;max-width:182mm;padding:6mm 0}

.q{border:1px solid #C3CAD6;border-radius:2mm;padding:3mm 4mm;margin:4mm 0;break-inside:avoid;page-break-inside:avoid}.q .cap{font-size:9pt;color:#5A6477;font-weight:bold;text-transform:uppercase;letter-spacing:.04em}.capline{font-size:9.5pt;margin:1mm 0 1.5mm;color:#1E3461}.q .qt{font-size:11.5pt;margin:1.5mm 0 2mm}
.probe{font-size:9pt;color:#5A6477;margin:0 0 2mm;padding-left:5mm}.rate{margin-top:2mm;font-weight:bold}.o{display:inline-block;width:7mm;height:7mm;border:1.2px solid #1E3461;border-radius:50%;text-align:center;line-height:6.6mm;margin-left:2.5mm;font-weight:bold;font-size:9.5pt}.o.on{background:#1E3461;color:#fff}

@media screen{body{padding:10mm 4mm}}`;

const ScanStore={

async function ensureScans(g){if(!g||!(g.scans||[]).length||SCANS[g.id])return;SCANS[g.id]={_loading:true};try{SCANS[g.id]=await ScanStore.load(g.id,g.scans.map(s=>s.id));}catch(e){SCANS[g.id]={};}if(R.v==="guide"&&R.id===g.id)render();}
async function shrinkImage(blob){
  const bmp=await createImageBitmap(blob).catch(async()=>{const u=URL.createObjectURL(blob);const im=new Image();await new Promise((r,j)=>{im.onload=r;im.onerror=j;im.src=u;});return im;});
  let max=1700,q=.72,data="";
  for(let i=0;i<6;i++){const sc=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);data=c.toDataURL("image/jpeg",q);if(data.length<235000)return data;q-=.1;max-=220;}
  return data;
}

const normH=t=>String(t||"").replace(/\(.*?\)/g,"").replace(/^\s*\d+\.\s*/,"").replace(/\s+\d+\s+of\s+\d+\s*$/,"").replace(/\s+\d+\s*$/,"").replace(/×/g,"").trim();
const HSEL="h1,h2,h3,h4,.tab,[data-help]";
function helpKey(el){if(el.dataset&&el.dataset.help)return el.dataset.help;const k=normH(el.textContent);if(HELP[k])return k;if(/source tracker$/.test(k))return"tracker";return k;}

  const b=$("#help .btn.pri");if(b)b.focus();}

const LP={t:null,x:0,y:0,fired:false};
document.addEventListener("pointerdown",e=>{if(e.button>0)return;const el=e.target.closest(HSEL);if(!el||el.hasAttribute("data-nohelp"))return;const k=helpKey(el);if(!HELP[k])return;
  LP.fired=false;LP.x=e.clientX;LP.y=e.clientY;clearTimeout(LP.t);el.classList.add("pressing");
  LP.el=el;LP.t=setTimeout(()=>{LP.fired=true;setTimeout(()=>{LP.fired=false;},700);el.classList.remove("pressing");showHelp(k);try{navigator.vibrate&&navigator.vibrate(12);}catch(x){}},480);});
const lpCancel=()=>{clearTimeout(LP.t);if(LP.el)LP.el.classList.remove("pressing");};
document.addEventListener("pointermove",e=>{if(Math.abs(e.clientX-LP.x)>10||Math.abs(e.clientY-LP.y)>10)lpCancel();});
["pointerup","pointercancel","scroll","dragstart"].forEach(ev=>document.addEventListener(ev,lpCancel,true));
document.addEventListener("click",e=>{if(LP.fired){LP.fired=false;if(!e.target.closest("#help")){e.preventDefault();e.stopPropagation();}}},true);
document.addEventListener("contextmenu",e=>{const el=e.target.closest(HSEL);if(!el)return;const k=helpKey(el);if(!HELP[k])return;e.preventDefault();if(!LP.fired)showHelp(k);});

/* ---------- Standalone installable app: optional Claude API key, install ---------- */
const PWA_MODEL_DEFAULT="claude-sonnet-5";
const keyGet=()=>{try{return localStorage.getItem("b2h-apikey")||"";}catch(e){return"";}};
const modelGet=()=>{try{return localStorage.getItem("b2h-model")||PWA_MODEL_DEFAULT;}catch(e){return PWA_MODEL_DEFAULT;}};
async function b64(blob){return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(blob);});}
function apiSample(){const key=keyGet();if(!key)return null;
  const call=async(prompt,opts={})=>{const content=[];for(const b of [].concat(opts.images||[])){const t=/png|webp|gif/.test(b.type||"")?b.type:"image/jpeg";content.push({type:"image",source:{type:"base64",media_type:t,data:await b64(b)}});}content.push({type:"text",text:prompt});
    let r;try{r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":keyGet(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:modelGet(),max_tokens:4096,messages:[{role:"user",content}]})});}
    catch(e){const x=new Error("No internet connection, or Anthropic could not be reached.");x.code="failed";throw x;}
    if(!r.ok){let m="";try{m=(await r.json()).error.message;}catch(e){}const x=new Error(r.status===401?"The API key was not accepted. Check it in Settings.":(m||"Anthropic returned an error ("+r.status+")."));x.code=r.status===429?"rate_limited":"failed";throw x;}
    const j=await r.json();return(j.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("");};
  const f=async(prompt,opts={})=>{const text=await call(prompt,opts);if(opts.onText)opts.onText({text,delta:text});return{text};};
  f.json=async(prompt,opts={})=>{const text=await call(prompt+"\n\nReply with only valid JSON and nothing else, with no code fences.",opts);const t=text.replace(/```json|```/g,"");const a=t.indexOf("{"),b=t.lastIndexOf("}");try{return JSON.parse(t.slice(a,b+1));}catch(e){const x=new Error("Claude's reply could not be read. Try again.");x.code="failed";throw x;}};
  f.limits=async()=>({images:{maxCount:8,mediaTypes:["image/jpeg","image/png","image/webp"]}});
  return f;}

   <div class="grid2" style="margin-top:10px"><label class="f"><span>API key</span><input id="apiKey" type="password" autocomplete="off" placeholder="${has?"Saved on this device":"sk-ant-..."}"></label><label class="f"><span>Model</span><input id="apiModel" value="${esc(modelGet())}"></label></div>
   <div class="btns" style="margin-top:12px"><button class="btn pri" data-act="keySave">Save</button>${has?`<button class="btn" data-act="keyTest">Test connection</button><button class="btn ghost danger" data-act="keyDel" data-confirm>Remove key</button>`:""}</div>

   <p class="small muted" style="margin-top:10px"><b>iPhone or iPad:</b> open this page in Safari, tap Share, then Add to Home Screen.<br><b>Android:</b> open in Chrome, tap the menu, then Install app.<br><b>Windows or Mac:</b> in Chrome or Edge, click the install icon at the right of the address bar.</p>

Object.assign(ACT,{
 keySave:()=>{const k=$("#apiKey").value.trim(),m=$("#apiModel").value.trim()||PWA_MODEL_DEFAULT;try{if(k)localStorage.setItem("b2h-apikey",k);localStorage.setItem("b2h-model",m);}catch(e){toast("This browser could not save the key.");return;}CAP.sample=apiSample();render();toast(k?"Key saved. Claude is on.":"Settings saved.");},

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  if(el.hasAttribute("data-confirm")&&!el.dataset.armed){el.dataset.armed="1";const t=el.textContent;el.textContent="Tap again to confirm";setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=t;}},3500);return;}
  const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el);}
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.b&&el.type!=="checkbox"&&el.tagName!=="SELECT"){const[c,id,p]=el.dataset.b.split("|");const o=obj(c,id);if(!o)return;let v=el.value;if(el.hasAttribute("data-num"))v=v===""?"":Number(v);setP(o,p,v);save(c,id);
    if(c==="roles"&&p==="brief.title"){const h=$("main h1");if(h)h.textContent=roleTitle(o);}
    if(c==="settings"&&p==="org")document.querySelectorAll(".brand strong,.mhead strong").forEach(x=>x.textContent=el.value||"StarSelect");
    refreshCalc();}
  const lv=el.dataset.live;
  if(lv==="out"){const p=$("#outPrev");if(p)p.textContent=outreachText(S.roles[R.id]);}
  if(lv==="candQ"){UI.candQ=el.value;const q=UI.candQ.toLowerCase();const list=Object.values(S.candidates).filter(c=>(UI.candF!=="pool"||c.future)&&(!q||[c.name,c.currentTitle,c.currentEmployer,c.location,c.tags,c.email].join(" ").toLowerCase().includes(q))).sort((a,b)=>candName(a).localeCompare(candName(b)));$("#candList").innerHTML=candRows(list);}
  if(lv==="pick"){UI.pickQ=el.value;$("#pickList").innerHTML=pickRows();}
  if(el.dataset.chdet){UI.ch.det[el.dataset.chdet]=el.value;}
  if(lv==="gbank"){UI.gbQ=el.value;$("#gbankList").innerHTML=gBankRows(S.guides[R.id]);}
  if(lv==="libQ"){UI.libQ=el.value;$("#bankList").innerHTML=bankRows();}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.member){api("/api/team/role",{userId:el.dataset.member,role:el.value}).then(()=>{toast("Role updated");SV.team=null;render();}).catch(e=>{toast(e.message);SV.team=null;render();});return;}
  if(el.id==="orgSwitch"){api("/api/switch",{orgId:el.value}).then(()=>location.replace("/")).catch(e=>toast(e.message));return;}
  if(el.dataset.orgplan){api("/api/admin/plan",{orgId:el.dataset.orgplan,plan:el.value}).then(()=>toast("Plan updated")).catch(e=>toast(e.message));return;}
  if(el.dataset.scan){const fs=[...(el.files||[])];if(fs.length)addScanFiles(fs);el.value="";return;}
  if(el.dataset.file){const f=el.files&&el.files[0];if(f)handleFile(el.dataset.file,f);el.value="";return;}
  if(el.id==="ns_role"){const w=$("#ns_newwrap");if(w)w.style.display=el.value?"none":"";return;}
  if(el.id==="gRole")return;
  if(el.dataset.stage){setStage(el.dataset.stage,el.value);return;}
  if(el.id==="repRole"){UI.repRole=el.value;render();return;}
  if(el.id==="libHidden"){UI.libHidden=el.checked;render();return;}
  if(el.id&&el.id.startsWith("qe_"))return;
  if(el.id==="importFile"&&el.files[0]){const fr=new FileReader();fr.onload=async()=>{try{const d=JSON.parse(fr.result);if(!d||!d.roles&&!d.candidates)throw 0;COLLS.forEach(c=>{if(d[c])Object.assign(S[c],d[c]);});if(d.settings)Object.assign(S.settings,d.settings);if(d.bank)Object.assign(S.bank,d.bank);toast("Importing");await Store.saveAll();render();toast("Backup imported");}catch(x){toast("That file is not a workspace backup.");}};fr.readAsText(el.files[0]);return;}
  if(!el.dataset.b)return;const[c,id,p]=el.dataset.b.split("|");const o=obj(c,id);if(!o)return;
  let v=el.type==="checkbox"?el.checked:el.value;if(el.hasAttribute("data-num"))v=v===""?"":Number(v);setP(o,p,v);save(c,id);
  if(c==="apps"&&p==="offer.status"&&v==="Accepted"&&o.stage!=="hired")toast("Offer accepted. Move the candidate to "+stLabel("hired")+" when confirmed.");
  if(el.hasAttribute("data-rr")){if(R.app)renderDrawer();else render();}else refreshCalc();
});
function refreshCalc(){
  document.querySelectorAll("[data-calc]").forEach(el=>{const[k,id,x]=el.dataset.calc.split(":");if(k==="gavg"){const g=S.guides[id];if(g)el.textContent=f1(gAvg(g))||"not scored";return;}const a=S.apps[id];if(!a)return;
    if(k==="ev")el.outerHTML=ev(a,el.classList.contains("lg"));else if(k==="cv")el.textContent=f1(cvAvg(a))||"not scored";else if(k==="scr")el.textContent=f1(scrAvg(a))||"not scored";
    else if(k==="mem")el.textContent=f1(memAvg(a,x,S.roles[a.roleId]))||"not scored";else if(k==="gavg"){}else if(k==="fee"){const f=feeFor(a);el.textContent=f?money(f):"add a salary and fee percentage";}});

document.addEventListener("dragleave",e=>{const z=e.target.closest&&e.target.closest("[data-dropfile]");if(z&&!z.contains(e.relatedTarget))z.classList.remove("over");});
document.addEventListener("drop",e=>{const z=e.target.closest&&e.target.closest("[data-dropfile]");if(!z)return;e.preventDefault();z.classList.remove("over");const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)handleFile(z.dataset.dropfile,f);});
document.addEventListener("keydown",e=>{if(e.key==="?"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){showHelp(currentHelp());return;}if(e.key==="Escape"&&$("#help").innerHTML){$("#help").innerHTML="";return;}if(e.key==="Escape"){if($("#modal").innerHTML)modal("");else if(R.app)ACT.closeApp();}});
